<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Usage">
<title>Claude Usage</title>
<!-- Written for Safari 12 (iOS 12): plain ES5, no ?. / ??, no flex gap. -->
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; color: #f4efe6; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
  .wrap { position: relative; height: 100%; box-sizing: border-box; padding: 28px 32px;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .row { display: -webkit-flex; display: flex; }
  .grow { -webkit-flex: 1; flex: 1; }
  .glass { background: rgba(6, 22, 40, 0.55); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; padding: 18px 22px; box-sizing: border-box; }
  .mono { font-family: Menlo, Courier, monospace; }
  .label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244, 239, 230, 0.62); }
  .amber { color: #f2b04a; }
  .pink { color: #f3a9bd; }

  header { -webkit-align-items: flex-start; align-items: flex-start; -webkit-justify-content: space-between; justify-content: space-between; }
  #clock { font-size: 64px; font-weight: 200; line-height: 1; letter-spacing: -0.02em; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  #date { margin-top: 6px; font-size: 17px; color: rgba(244,239,230,.8); text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .pill { border-radius: 999px; padding: 8px 14px; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7ee2a8; margin-right: 8px; vertical-align: 1px; }
  .dot.off { background: #ff7a7a; }

  .hero { margin-top: auto; -webkit-align-items: stretch; align-items: stretch; }
  .big { margin-right: 18px; width: 40%; }
  #total { font-size: 96px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; margin: 10px 0 6px; }
  .sub { font-size: 15px; color: rgba(244,239,230,.75); }
  .tiles { -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -6px; }
  .tile { width: 50%; padding: 6px; box-sizing: border-box; }
  .tile .glass { height: 100%; padding: 14px 18px; }
  .tile .v { font-size: 34px; font-weight: 300; margin-top: 6px; }

  .bottom { margin-top: 18px; }
  .chart { margin-right: 18px; }
  .bars { height: 96px; margin-top: 12px; -webkit-align-items: flex-end; align-items: flex-end; }
  .bar { -webkit-flex: 1; flex: 1; margin: 0 2px; border-radius: 4px 4px 1px 1px; background: rgba(255,255,255,.18); min-height: 3px; }
  .bar.now { background: #f2b04a; }
  .bar.on { background: rgba(243, 169, 189, .85); }
  .axis { margin-top: 6px; font-size: 11px; color: rgba(244,239,230,.5); -webkit-justify-content: space-between; justify-content: space-between; }
  .models { width: 30%; }
  .model { margin-top: 10px; font-size: 15px; }
  .track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 5px; overflow: hidden; }
  .fill { height: 100%; background: #f2b04a; border-radius: 3px; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <header class="row">
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div class="glass pill mono"><span id="dot" class="dot off"></span><span id="status">connecting…</span></div>
  </header>

  <div class="row hero">
    <div class="glass big">
      <div class="label">Claude tokens · today</div>
      <div id="total" class="amber">–</div>
      <div class="sub"><span id="msgs">–</span> messages · last active <span id="last">–</span></div>
    </div>
    <div class="grow row tiles">
      <div class="tile"><div class="glass"><div class="label">Output</div><div class="v" id="out">–</div></div></div>
      <div class="tile"><div class="glass"><div class="label">Input + cache write</div><div class="v" id="in">–</div></div></div>
      <div class="tile"><div class="glass"><div class="label">Cache read</div><div class="v" id="cr">–</div></div></div>
      <div class="tile"><div class="glass"><div class="label">Last 7 days</div><div class="v pink" id="week">–</div></div></div>
    </div>
  </div>

  <div class="row bottom">
    <div class="glass grow chart">
      <div class="label">Tokens by hour · today</div>
      <div class="row bars" id="bars"></div>
      <div class="row axis mono"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
    </div>
    <div class="glass models">
      <div class="label">Models · today</div>
      <div id="models"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Text-character landscape background (drawn once per resize) ----------
  function hash(x, y) { var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
  function noise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y) { var v = 0, amp = 0.5; for (var i = 0; i < 4; i++) { v += amp * noise(x, y); x *= 2; y *= 2; amp *= 0.5; } return v; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  var SKY_TOP = [10, 38, 70], SKY_LOW = [38, 108, 150], CLOUD = [244, 240, 232], CLOUD_SH = [150, 170, 190];
  var AMBER = [242, 176, 74], PINK = [243, 169, 189], ROCK = [70, 78, 92], GROUND = [40, 34, 38];

  function scene(x, y) { // x, y in 0..1, returns [rgb, brightness]
    var ridge = 0.72 + 0.07 * fbm(x * 3 + 7, 1.3) - 0.05 * Math.sin(x * 3.1);
    if (y > ridge) { // foreground hills with blossoms
      var n = fbm(x * 9, y * 9), c;
      if (n > 0.62) c = mix(PINK, [255, 220, 230], (n - 0.62) * 2);
      else if (n > 0.52) c = mix(AMBER, [120, 70, 30], 1 - (n - 0.52) * 10);
      else c = mix(GROUND, ROCK, n * 1.4);
      return c;
    }
    var col = mix(SKY_TOP, SKY_LOW, clamp(y / 0.75));
    var sx = x - 0.8, sy = (y - 0.22) * 1.3, sun = Math.exp(-(sx * sx + sy * sy) * 30);
    col = mix(col, AMBER, clamp(sun * 0.9));
    var centre = 0.4 + 0.15 * (noise(x * 2.5, 9) - 0.5) * 2;
    var band = Math.exp(-Math.pow((y - centre) / 0.22, 2));
    var cl = (fbm(x * 3.2, y * 5 + 3) + 0.25) * band;
    if (cl > 0.5) {
      var lit = clamp((cl - 0.5) * 3 + fbm(x * 14, y * 14) * 0.5 - 0.25 + (centre - y) * 1.5);
      col = mix(mix(col, CLOUD_SH, clamp((cl - 0.5) * 8)), CLOUD, lit);
    }
    return col;
  }

  var RAMP = ' .,:;-=+*x%#@';
  function drawBg() {
    var cv = $('bg'), dpr = window.devicePixelRatio || 1, w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    var cw = 6, ch = 9;
    ctx.font = '8px Menlo, monospace';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#050f1c'; ctx.fillRect(0, 0, w, h);
    for (var gy = 0; gy < h; gy += ch) {
      for (var gx = 0; gx < w; gx += cw) {
        var c = scene(gx / w, gy / h);
        var lum = (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 255;
        var j = 0.85 + hash(gx, gy) * 0.3;
        ctx.fillStyle = 'rgb(' + (c[0] * 0.35 | 0) + ',' + (c[1] * 0.35 | 0) + ',' + (c[2] * 0.35 | 0) + ')';
        ctx.fillRect(gx, gy, cw, ch);
        ctx.fillStyle = 'rgb(' + Math.min(255, c[0] * j | 0) + ',' + Math.min(255, c[1] * j | 0) + ',' + Math.min(255, c[2] * j | 0) + ')';
        ctx.fillText(RAMP.charAt(Math.min(RAMP.length - 1, (lum * j * RAMP.length) | 0)), gx, gy);
      }
    }
  }
  drawBg();
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawBg, 300); });

  // ---------- Clock ----------
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  tick(); setInterval(tick, 1000);

  // ---------- Data ----------
  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K';
    return String(n);
  }
  function ago(t, now) {
    if (!t) return 'never';
    var m = Math.round((now - t) / 6e4);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    if (m < 1440) return Math.round(m / 60) + ' h ago';
    return Math.round(m / 1440) + ' d ago';
  }

  var bars = $('bars');
  for (var i = 0; i < 24; i++) bars.appendChild(document.createElement('div')).className = 'bar';

  function render(s) {
    var t = s.today;
    $('total').textContent = fmt(t.total);
    $('msgs').textContent = t.messages;
    $('last').textContent = ago(s.lastActivity, s.now);
    $('out').textContent = fmt(t.output);
    $('in').textContent = fmt(t.input + t.cacheWrite);
    $('cr').textContent = fmt(t.cacheRead);
    $('week').textContent = fmt(s.week.total);

    var max = Math.max.apply(null, s.hourly) || 1, hour = new Date(s.now).getHours();
    for (var i = 0; i < 24; i++) {
      var b = bars.children[i];
      b.style.height = Math.round(s.hourly[i] / max * 100) + '%';
      b.className = 'bar' + (i === hour ? ' now' : s.hourly[i] > 0 ? ' on' : '');
    }

    var names = Object.keys(s.models).sort(function (a, b) { return s.models[b] - s.models[a]; }).slice(0, 4);
    var top = names.length ? s.models[names[0]] : 1, html = '';
    for (var k = 0; k < names.length; k++) {
      html += '<div class="model"><div class="row"><span class="grow">' + names[k] + '</span><span class="mono">' + fmt(s.models[names[k]]) +
        '</span></div><div class="track"><div class="fill" style="width:' + Math.round(s.models[names[k]] / top * 100) + '%"></div></div></div>';
    }
    $('models').innerHTML = html || '<div class="model sub">No usage yet today</div>';
  }

  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/stats', true);
    x.timeout = 10000;
    x.onload = function () {
      if (x.status !== 200) return offline();
      try { render(JSON.parse(x.responseText)); } catch (e) { return offline(); }
      $('dot').className = 'dot';
      $('status').textContent = 'live · ' + pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());
    };
    x.onerror = x.ontimeout = offline;
    x.send();
  }
  function offline() { $('dot').className = 'dot off'; $('status').textContent = 'PC offline'; }
  poll(); setInterval(poll, 15000);
})();
</script>
</body>
</html>
