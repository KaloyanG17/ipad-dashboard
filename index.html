<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home</title>
<!-- Written for Safari 12 (iOS 12): plain ES5, no ?. / ??, no flex gap. CSS grid is fine. -->
<style>
  html, body { margin: 0; height: 100%; background: #061a2e; color: #f4efe6; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
  .row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .col { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .grow { -webkit-flex: 1; flex: 1; min-width: 0; }
  .glass { background: rgba(6, 22, 40, 0.58); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; box-sizing: border-box; }
  .mono { font-family: Menlo, Courier, monospace; }
  .label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244, 239, 230, 0.62); }
  .dim { color: rgba(244, 239, 230, 0.62); }
  .small { font-size: 13px; }
  .err { font-size: 14px; color: #ffb3a7; margin-top: 8px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pill { display: inline-block; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 14px; margin: 0 6px 6px 0; }
  .pill.on { background: #f2b04a; color: #1b1206; }
  .pill:active, .btn:active, .item:active { opacity: .6; }

  /* grid of resizable cards */
  #grid { position: relative; height: 100%; box-sizing: border-box; padding: 20px 24px; display: -ms-grid; display: grid;
    grid-template-columns: repeat(12, 1fr); grid-auto-rows: 1fr; grid-auto-flow: row dense; grid-gap: 14px; }
  .card { position: relative; min-width: 0; min-height: 0; padding: 14px 18px; overflow: hidden; }
  .card.bare { background: none; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 4px 6px; }

  /* clock */
  #clock { font-size: 76px; font-weight: 200; line-height: 1; letter-spacing: -0.02em; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  #date { margin-top: 8px; font-size: 18px; color: rgba(244,239,230,.85); text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .compact #clock { font-size: 48px; }
  .compact #date { font-size: 14px; margin-top: 4px; }

  /* weather */
  #wnow { -webkit-align-items: flex-end; align-items: flex-end; }
  #wicon { font-size: 40px; line-height: 1; margin-right: 10px; }
  #wtemp { font-size: 48px; font-weight: 200; line-height: 1; margin-right: 14px; }
  #wdesc { font-size: 14px; line-height: 1.45; }
  .days { margin-top: 10px; -webkit-justify-content: space-between; justify-content: space-between; }
  .day { text-align: center; font-size: 13px; -webkit-flex: 1; flex: 1; }
  .day b { display: block; font-size: 21px; font-weight: normal; margin: 3px 0; }
  .compact .days, .compact #wmore { display: none; }

  /* lights */
  .light { padding: 10px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .light:first-child { border-top: 0; }
  .lname { font-size: 17px; }
  .switch { width: 58px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.18); position: relative; -webkit-flex: none; flex: none; -webkit-transition: background .2s; transition: background .2s; }
  .switch i { position: absolute; left: 3px; top: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; -webkit-transition: -webkit-transform .2s; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .switch.on { background: #f2b04a; }
  .switch.on i { -webkit-transform: translateX(24px); transform: translateX(24px); }
  .off .lname, .off .sws, .off input { opacity: .45; }
  .theme-btn { margin: 0 12px 0 0; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 30px; background: transparent; margin: 6px 0 2px; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  input.hue::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  input.temp::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #ffb46b, #fff4e5, #cfe0ff); }
  input.hue::-webkit-slider-thumb, input.temp::-webkit-slider-thumb { margin-top: -6px; }
  .sws { -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .sw { width: 32px; height: 32px; border-radius: 50%; margin: 4px 10px 0 0; border: 2px solid rgba(255,255,255,.25); box-sizing: border-box; }
  .compact .sws, .compact .light input { display: none; }

  /* music */
  #art { width: 104px; height: 104px; border-radius: 14px; background: rgba(255,255,255,.08) center / cover no-repeat; -webkit-flex: none; flex: none; margin-right: 14px; }
  #title { font-size: 18px; margin-bottom: 3px; }
  .track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.15); margin-top: 12px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #f3a9bd; border-radius: 3px; }
  .times { -webkit-justify-content: space-between; justify-content: space-between; font-size: 11px; margin-top: 5px; }
  .controls { margin-top: auto; padding-top: 6px; -webkit-justify-content: space-around; justify-content: space-around; }
  .btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.1); display: -webkit-flex; display: flex; -webkit-flex: none; flex: none;
    -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .btn.big { width: 70px; height: 70px; background: #f4efe6; }
  .btn.sm { width: 44px; height: 44px; }
  .btn svg { width: 24px; height: 24px; fill: #f4efe6; }
  .btn.sm svg { width: 20px; height: 20px; }
  .btn.big svg { width: 30px; height: 30px; fill: #0b2440; }
  .btn.on { background: #f2b04a; }
  .btn.on svg { fill: #1b1206; }
  .vol { margin-top: 4px; }
  .vol svg { width: 18px; height: 18px; fill: rgba(244,239,230,.6); -webkit-flex: none; flex: none; margin-right: 10px; }
  .compact #art, .compact .vol, .compact .times, .compact #device { display: none; }
  .compact .track { margin-top: 6px; }

  /* sites */
  .site { margin: 4px 18px 4px 0; font-size: 14px; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #7ee2a8; margin-right: 8px; vertical-align: 1px; box-shadow: 0 0 8px rgba(126,226,168,.7); }
  .dot.down { background: #ff7a7a; box-shadow: 0 0 8px rgba(255,122,122,.8); }

  /* layout editing */
  #gear { position: fixed; right: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.08); z-index: 5;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #gear svg { width: 18px; height: 18px; fill: rgba(244,239,230,.5); }
  .edit { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 3; background: rgba(4,14,26,.72); border-radius: inherit;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
    -webkit-align-content: center; align-content: center; padding: 4px; box-sizing: border-box; }
  .editing .edit { display: -webkit-flex; display: flex; }
  .editing #grid { padding-bottom: 76px; }
  .editing .card { border: 2px dashed rgba(242,176,74,.7); }
  .edit .name { font-size: 15px; margin: 0 10px 0 4px; white-space: nowrap; }
  .edit .pill { margin: 3px; min-width: 22px; text-align: center; padding: 8px 11px; font-size: 13px; }
  #editbar { display: none; position: fixed; left: 50%; bottom: 12px; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 6; padding: 10px 14px 4px; white-space: nowrap; }
  .editing #editbar { display: block; }

  /* sheets (full-screen panels for browsing music and light themes) */
  #sheet { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; background: rgba(2,8,16,.55); padding: 28px; box-sizing: border-box; }
  #sheet.open { display: block; }
  .sheet-in { height: 100%; padding: 18px 22px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; background: rgba(6,22,40,.9); }
  .sheet-title { font-size: 22px; margin-right: 14px; }
  #tabs .pill { margin-bottom: 0; }
  #sheetx { width: 44px; height: 44px; font-size: 22px; text-align: center; line-height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); margin-left: 12px; }
  #tools { margin-top: 14px; }
  #tools input[type=search], #tools input[type=text] { -webkit-appearance: none; width: 100%; box-sizing: border-box; font-size: 17px; padding: 11px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #f4efe6; outline: none; -webkit-user-select: text; user-select: text; }
  #sheetbody { margin-top: 12px; -webkit-flex: 1; flex: 1; min-height: 0; }
  .item { padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .thumb { width: 46px; height: 46px; border-radius: 8px; background: rgba(255,255,255,.1) center / cover no-repeat; margin-right: 14px; -webkit-flex: none; flex: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 8px; }
  .grid2 .pill { margin: 0; text-align: center; padding: 14px 8px; border-radius: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 18px; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 20; padding: 10px 18px; font-size: 15px; opacity: 0;
    -webkit-transition: opacity .25s; transition: opacity .25s; pointer-events: none; }
  #keymsg { display: none; position: fixed; left: 50%; top: 50%; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%); width: 420px; text-align: center; padding: 18px; z-index: 30; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="grid">
  <div class="card bare" id="card-clock">
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>

  <div class="card glass" id="card-weather">
    <div class="row" id="wnow">
      <div id="wicon">·</div><div id="wtemp">--°</div>
      <div id="wdesc" class="grow"><span id="wtext">Loading weather…</span><br><span class="dim" id="wmore"></span></div>
    </div>
    <div class="row days" id="days"></div>
  </div>

  <div class="card glass col" id="card-lights">
    <div class="row"><div class="label grow">Lights</div><span class="pill" id="allon">All on</span><span class="pill" id="alloff">All off</span></div>
    <div id="lights" class="scroll grow"><div class="dim" style="margin-top:10px">Loading…</div></div>
  </div>

  <div class="card glass col" id="card-music">
    <div class="row" style="margin-bottom:10px"><div class="label grow">Spotify</div><span class="pill" id="browse" style="margin:0">Browse</span></div>
    <div class="row" style="-webkit-align-items:flex-start;align-items:flex-start">
      <div id="art"></div>
      <div class="grow"><div id="title" class="ellipsis">–</div><div id="artist" class="dim ellipsis"></div>
        <div id="device" class="dim small ellipsis" style="margin-top:6px"></div><div id="merr" class="err"></div></div>
    </div>
    <div class="track"><div id="bar"></div></div>
    <div class="row times mono dim"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="row vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="volume" min="0" max="100"></div>
    <div class="row controls">
      <div class="btn sm" id="shuffle"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 17.9 7.5l2 2V4h-5.4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2-3.2-3z"/></svg></div>
      <div class="btn" data-a="previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></div>
      <div class="btn big" id="pp" data-a="play"><svg viewBox="0 0 24 24"><path id="ppicon" d="M8 5v14l11-7z"/></svg></div>
      <div class="btn" data-a="next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div>
      <div class="btn sm" id="devbtn"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H4zM2 18h20v2H2z"/></svg></div>
    </div>
  </div>

  <div class="card glass row" id="card-sites" style="-webkit-flex-wrap:wrap;flex-wrap:wrap">
    <div class="label" style="margin-right:18px">Sites</div>
    <div id="sites" class="row grow" style="-webkit-flex-wrap:wrap;flex-wrap:wrap"><span class="dim">Loading…</span></div>
  </div>
</div>

<div id="gear"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></div>
<div id="editbar" class="glass"></div>

<div id="sheet"><div class="sheet-in glass">
  <div class="row"><div class="sheet-title" id="sheettitle"></div><div class="row grow" id="tabs"></div><div id="sheetx">✕</div></div>
  <div id="tools"></div>
  <div id="sheetbody" class="scroll"></div>
</div></div>

<div id="toast" class="glass"></div>
<div class="glass" id="keymsg">Add your dashboard key to the address:<br><span class="mono">…vercel.app/?key=YOUR_DASH_KEY</span><br><br><a href="?demo" class="pill on" style="text-decoration:none">Try the demo instead</a></div>
<div id="demotag" class="pill on" style="display:none;position:fixed;left:50%;bottom:6px;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:4;font-size:12px;padding:5px 12px">Demo · sample data</div>

<script>
// ===== Settings: change the city to yours =====
var CITY = 'Varna';

(function () {
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function closest(el, cls, stop) { while (el && el !== stop) { if (el.classList && el.classList.contains(cls)) return el; el = el.parentNode; } return null; }
  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function () { t.style.opacity = 0; }, 2600); }

  // Key comes from ?key=… once, then is remembered. The URL keeps it too, so "Add to Home Screen" works.
  var m = /[?&]key=([^&]+)/.exec(location.search);
  var KEY = m ? decodeURIComponent(m[1]) : (localStorage.getItem('dashKey') || '');
  if (m) localStorage.setItem('dashKey', KEY);
  // ?demo runs everything on sample data in the page, so anyone can try it without accounts.
  var DEMO = /[?&]demo(&|=|$)/.test(location.search);
  if (DEMO) { KEY = 'demo'; $('demotag').style.display = ''; }
  if (!KEY) $('keymsg').style.display = 'block';

  function art(a, b) {
    return 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><defs><linearGradient id="g" x2="1" y2="1"><stop offset="0" stop-color="' + a +
      '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs><rect width="10" height="10" fill="url(#g)"/></svg>');
  }
  var D = {
    lights: [{ sku: 'H6056', device: 'D1', name: 'Desk light bars', online: true, on: true, brightness: 80 },
      { sku: 'H6046', device: 'D2', name: 'Bed bar', online: true, on: false, brightness: 40 }],
    scenes: ['Sunrise', 'Sunset', 'Aurora', 'Forest', 'Ocean', 'Fire', 'Candlelight', 'Party', 'Romantic', 'Rainbow', 'Starry sky', 'Movie', 'Reading', 'Breathe', 'Lightning']
      .map(function (n, i) { return { name: n, kind: 'scene', value: { id: i, paramId: i } }; }).concat([{ name: 'My chill', kind: 'diyScene', value: 7 }]),
    tracks: [['Midnight Drive', 'Sample Artist', '#f2b04a', '#7a2d6b'], ['Neon Harbour', 'The Placeholders', '#0a84ff', '#34c759'], ['Paper Planes', 'Demo Kid', '#ff2d92', '#ff9500']],
    t: 0, playing: true, progress: 60000, at: Date.now(), shuffle: false, volume: 55, device: 'Living room speaker',
    playlists: [{ name: 'Liked Songs', sub: 'Your saved tracks', img: null, uri: 'liked' }, { name: 'Gym', sub: 'Playlist · me', img: art('#ff3b30', '#ff9500'), uri: 'spotify:playlist:gym' },
      { name: 'Chill evening', sub: 'Playlist · me', img: art('#0a84ff', '#bf5af2'), uri: 'spotify:playlist:chill' }, { name: 'Focus', sub: 'Playlist · me', img: art('#34c759', '#0a84ff'), uri: 'spotify:playlist:focus' }],
    devices: [{ id: 'd1', name: 'Living room speaker', sub: 'Speaker' }, { id: 'd2', name: 'Desktop PC', sub: 'Computer' }, { id: 'd3', name: 'Phone', sub: 'Smartphone' }]
  };
  function demoApi(method, path, b) {
    var q = path.split('?')[1] || '', tr = D.tracks[D.t];
    if (path.indexOf('/api/sites') === 0) return [{ url: 'https://example.com', up: true, status: 200, ms: 80 + Math.round(Math.random() * 60) }, { url: 'https://github.com', up: true, status: 200, ms: 120 + Math.round(Math.random() * 80) }, { url: 'https://old-project.example', up: false, status: 503 }];
    if (path.indexOf('/api/govee') === 0) {
      if (method === 'GET') return q.indexOf('scenes') >= 0 ? D.scenes : JSON.parse(JSON.stringify(D.lights));
      for (var i = 0; i < D.lights.length; i++) if (D.lights[i].device === b.device) {
        if (b.action === 'power') D.lights[i].on = !!b.value; else D.lights[i].on = true;
        if (b.action === 'brightness') D.lights[i].brightness = b.value;
      }
      return { ok: true };
    }
    if (method === 'GET') {
      if (q.indexOf('view=playlists') >= 0) return D.playlists;
      if (q.indexOf('view=devices') >= 0) return D.devices.map(function (d) { return { id: d.id, name: d.name, sub: d.sub + (d.name === D.device ? ' · playing here' : '') }; });
      if (q.indexOf('view=search') >= 0) {
        var term = decodeURIComponent((/q=([^&]*)/.exec(q) || ['', ''])[1]).toLowerCase();
        return D.tracks.map(function (t, i) { return { name: t[0], sub: 'Song · ' + t[1], img: art(t[2], t[3]), uri: 'spotify:track:' + i }; })
          .filter(function (r) { return (r.name + r.sub).toLowerCase().indexOf(term) >= 0; });
      }
      var p = D.progress + (D.playing ? Date.now() - D.at : 0);
      if (p > 200000) { D.t = (D.t + 1) % D.tracks.length; D.progress = 0; D.at = Date.now(); p = 0; tr = D.tracks[D.t]; }
      return { active: true, playing: D.playing, title: tr[0], artist: tr[1], art: art(tr[2], tr[3]), progress: p, duration: 200000, shuffle: D.shuffle, device: D.device, volume: D.volume };
    }
    D.progress += D.playing ? Date.now() - D.at : 0; D.at = Date.now();
    if (b.action === 'play' || b.action === 'pause') D.playing = b.action === 'play';
    if (b.action === 'next' || b.action === 'previous' || b.action === 'playUri') {
      var n = /^spotify:track:(\d)$/.exec(b.uri || '');
      D.t = n ? +n[1] : (D.t + (b.action === 'previous' ? D.tracks.length - 1 : 1)) % D.tracks.length;
      D.progress = 0; D.playing = true;
    }
    if (b.action === 'volume') D.volume = b.value;
    if (b.action === 'shuffle') D.shuffle = !!b.value;
    if (b.action === 'device') for (var k = 0; k < D.devices.length; k++) if (D.devices[k].id === b.id) D.device = D.devices[k].name;
    return { ok: true };
  }

  function api(method, path, body, cb) {
    if (DEMO) return setTimeout(function () { cb(null, demoApi(method, path, body)); }, 150);
    var x = new XMLHttpRequest();
    x.open(method, path, true);
    x.timeout = 15000;
    x.setRequestHeader('x-dash-key', KEY);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function () {
      var d = null; try { d = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300) cb(null, d);
      else cb((d && d.error) || ('Error ' + x.status), d);
    };
    x.onerror = function () { cb('No connection'); };
    x.ontimeout = function () { cb('Timed out'); };
    x.send(body ? JSON.stringify(body) : null);
  }
  function getJSON(url, cb) {

      song = d; songAt = Date.now(); renderSong();
    });
  }
  function spotify(body, done) {
    api('POST', '/api/spotify', body, function (err) {
      if (err) toast(err);
      setTimeout(loadSong, 700);
      if (done) done(err);
    });
  }
  var controls = document.querySelectorAll('.btn[data-a]');
  for (var b = 0; b < controls.length; b++) controls[b].addEventListener('click', function () {
    var a = this.getAttribute('data-a');
    if (song && song.active && (a === 'play' || a === 'pause')) { song.progress += song.playing ? Date.now() - songAt : 0; songAt = Date.now(); song.playing = a === 'play'; renderSong(); }
    spotify({ action: a });
  });
  $('shuffle').addEventListener('click', function () {
    if (!song || !song.active) return;
    song.shuffle = !song.shuffle; renderSong(); spotify({ action: 'shuffle', value: song.shuffle });
  });
  $('volume').addEventListener('touchstart', function () { volDragging = true; });
  $('volume').addEventListener('mousedown', function () { volDragging = true; });
  $('volume').addEventListener('change', function () { volDragging = false; if (song) song.volume = +this.value; spotify({ action: 'volume', value: +this.value }); });

  function play(it) {
    spotify({ action: 'playUri', uri: it.uri }, function (err) { if (!err) { toast('Playing ' + it.name); closeSheet(); } });
  }
  function openMusicSheet(first) {
    var tabs = [{ id: 'playlists', label: 'Playlists' }, { id: 'search', label: 'Search' }, { id: 'devices', label: 'Devices' }];
    if (first === 'devices') tabs.unshift(tabs.pop());
    openSheet('Spotify', tabs, function (tab) {
      if (tab === 'search') {
        $('tools').innerHTML = '<form id="sform"><input type="search" id="q" placeholder="Songs, artists, albums, playlists" autocomplete="off"></form>';
        $('sheetbody').innerHTML = '<div class="dim" style="padding:12px 4px">Type and press Search on the keyboard</div>';
        $('sform').addEventListener('submit', function (e) {
          e.preventDefault(); $('q').blur(); loading();
          api('GET', '/api/spotify?view=search&q=' + encodeURIComponent($('q').value), null, function (err, d) {
            if (err) return sheetError(err);
            listItems(d, play, 'No results');
          });
        });
        return;
      }
      loading();
      api('GET', '/api/spotify?view=' + tab, null, function (err, d) {
        if (sheet.tab !== tab) return;
        if (err) return sheetError(err);
        if (tab === 'playlists') return listItems(d, play, 'No playlists');
        listItems(d, function (dev) {
          spotify({ action: 'device', id: dev.id }, function (e2) { if (!e2) { toast('Playing on ' + dev.name); closeSheet(); } });
        }, 'No devices found. Open Spotify on your phone, PC or speaker first.');
      });
    });
  }
  $('browse').addEventListener('click', function () { openMusicSheet(); });
  $('devbtn').addEventListener('click', function () { openMusicSheet('devices'); });
  loadSong(); setInterval(loadSong, 5000); setInterval(drawProgress, 1000);

  // ---------- Sites ----------
  function loadSites() {
    if (!KEY) return;
    api('GET', '/api/sites', null, function (err, d) {
      if (err) { $('sites').innerHTML = '<span class="err" style="margin:0">' + esc(err) + '</span>'; return; }
      var html = '';
      for (var i = 0; i < d.length; i++) {
        var name = d[i].url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        html += '<span class="site"><span class="dot' + (d[i].up ? '' : ' down') + '"></span>' + esc(name) +
          ' <span class="dim mono">' + (d[i].up ? d[i].ms + 'ms' : (d[i].status || 'down')) + '</span></span>';
      }
      $('sites').innerHTML = html || '<span class="dim">No sites set (SITES env var)</span>';
    });
  }
  loadSites(); setInterval(loadSites, 60000);
})();
</script>
</body>
</html>
