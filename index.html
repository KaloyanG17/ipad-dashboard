<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home</title>
<!-- Written for Safari 12 (iOS 12): plain ES5, no ?. / ??, no flex gap. CSS grid is fine. -->
<style>
  /* iOS dark appearance: system colours, label and fill levels, SF type. Written for Safari 12. */
  :root {
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --yellow: #ffd60a;
    --label: #fff; --label2: rgba(235, 235, 245, 0.6); --label3: rgba(235, 235, 245, 0.3);
    --fill: rgba(120, 120, 128, 0.36); --fill2: rgba(120, 120, 128, 0.24); --sep: rgba(84, 84, 88, 0.5);
  }
  html, body { margin: 0; height: 100%; background: #000; color: var(--label); overflow: hidden;
    font: 400 16px/1.3 -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
  .row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .col { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .grow { -webkit-flex: 1; flex: 1; min-width: 0; }
  /* The material: a dark translucent layer, with a bright top edge where light catches it */
  .glass { background: rgba(38, 38, 42, 0.5); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 22px; box-sizing: border-box;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 10px 30px rgba(0, 0, 0, 0.22); }
  .mono { font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum"; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; color: var(--label2); }
  .dim { color: var(--label2); }
  .small { font-size: 13px; }
  .err { font-size: 14px; color: #ff6961; margin-top: 8px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { display: none; }
  .pill { display: inline-block; padding: 7px 14px; border-radius: 999px; background: var(--fill2); font-size: 15px; font-weight: 500; margin: 0 6px 6px 0;
    -webkit-transition: -webkit-transform .1s ease-out, opacity .1s ease-out; transition: transform .1s ease-out, opacity .1s ease-out; }
  .pill.on { background: var(--blue); color: #fff; }
  /* feedback on the press itself, not on release */
  .pill:active, .btn:active, .mood:active, .sw:active, #gear:active, #statsbtn:active, #sheetx:active { -webkit-transform: scale(0.95); transform: scale(0.95); opacity: .75; }
  .item:active { background: var(--fill2); }
  /* segmented control */
  .seg { display: inline-block; background: var(--fill2); border-radius: 9px; padding: 2px; white-space: nowrap; vertical-align: middle; }
  .seg:empty { display: none; }
  .seg .pill { margin: 0; background: none; border-radius: 7px; padding: 5px 13px; font-size: 14px; }
  .seg .pill.on { background: #636366; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22); }

  /* grid of resizable cards */
  #grid { position: relative; height: 100%; box-sizing: border-box; padding: 20px 24px; display: -ms-grid; display: grid;
    grid-template-columns: repeat(12, 1fr); grid-auto-rows: 1fr; grid-auto-flow: row dense; grid-gap: 14px; }
  .card { position: relative; min-width: 0; min-height: 0; padding: 14px 18px; overflow: hidden; }
  .card.bare { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 2px 6px; }

  /* clock: thin and tightly tracked, like the iOS 12 lock screen */
  #clock { font-size: 84px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; text-shadow: 0 2px 20px rgba(0,0,0,.35); }
  #date { margin-top: 8px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: rgba(255,255,255,.92); text-shadow: 0 1px 10px rgba(0,0,0,.4); }
  .compact #clock { font-size: 50px; }
  .compact #date { font-size: 15px; margin-top: 4px; }

  /* weather */
  #wnow { -webkit-align-items: flex-end; align-items: flex-end; }
  #wicon { font-size: 38px; line-height: 1; margin-right: 10px; }
  #wtemp { font-size: 50px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; margin-right: 14px; }
  #wdesc { font-size: 15px; font-weight: 500; line-height: 1.4; }
  #wmore { font-size: 13px; font-weight: 400; }
  #wtext, #wmore { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wdesc br { display: none; }
  .days { margin-top: 10px; -webkit-justify-content: space-between; justify-content: space-between; }
  .day { text-align: center; font-size: 13px; font-weight: 500; -webkit-flex: 1; flex: 1; }
  .day b { display: block; font-size: 21px; font-weight: normal; margin: 3px 0; }
  .compact .days, .compact #wmore { display: none; }

  /* lights */
  .light { padding: 10px 0; border-top: 1px solid var(--sep); }
  .light:first-child { border-top: 0; }
  .lname { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  .switch { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; -webkit-flex: none; flex: none; -webkit-transition: background .2s; transition: background .2s; }
  .switch i { position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    -webkit-transition: -webkit-transform .22s cubic-bezier(.3,.9,.3,1); transition: transform .22s cubic-bezier(.3,.9,.3,1); box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); }
  .switch.on { background: var(--green); }
  .switch.on i { -webkit-transform: translateX(20px); transform: translateX(20px); }
  .off .lname, .off .sws, .off input { opacity: .4; }
  .theme-btn { margin: 0 12px 0 0; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 30px; background: transparent; margin: 6px 0 2px; }
  /* the part of the track left of the thumb is filled, as on iOS; --p is kept in step by the script */
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #fff 0, #fff var(--p, 50%), rgba(120,120,128,.36) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; margin-top: -11px;
    box-shadow: 0 0.5px 4px rgba(0,0,0,.12), 0 6px 13px rgba(0,0,0,.18); }
  input.hue::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  input.temp::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #ffb46b, #fff4e5, #cfe0ff); }
  input.hue::-webkit-slider-thumb, input.temp::-webkit-slider-thumb { margin-top: -7px; }
  .sws { -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .sw { width: 30px; height: 30px; border-radius: 50%; margin: 4px 11px 0 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); box-sizing: border-box; }
  .compact .sws, .compact .light input { display: none; }

  /* music */
  #art { width: 104px; height: 104px; border-radius: 10px; background: var(--fill2) center / cover no-repeat; -webkit-flex: none; flex: none; margin-right: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  #title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px; }
  #artist { font-size: 15px; }
  .track { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 12px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: rgba(255,255,255,.92); border-radius: 3px; }
  .times { -webkit-justify-content: space-between; justify-content: space-between; font-size: 12px; margin-top: 5px; }
  .controls { margin-top: auto; padding-top: 6px; -webkit-justify-content: space-around; justify-content: space-around; }
  .btn { width: 54px; height: 54px; border-radius: 50%; background: var(--fill2); display: -webkit-flex; display: flex; -webkit-flex: none; flex: none;
    -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
    -webkit-transition: -webkit-transform .1s ease-out, opacity .1s ease-out; transition: transform .1s ease-out, opacity .1s ease-out; }
  .btn.big { width: 66px; height: 66px; background: #fff; }
  .btn.sm { width: 42px; height: 42px; }
  .btn svg { width: 24px; height: 24px; fill: #fff; }
  .btn.sm svg { width: 19px; height: 19px; }
  .btn.big svg { width: 30px; height: 30px; fill: #000; }
  .btn.on { background: var(--blue); }
  .vol { margin-top: 4px; }
  .vol svg { width: 18px; height: 18px; fill: var(--label2); -webkit-flex: none; flex: none; margin-right: 10px; }
  .compact #art, .compact .vol, .compact .times, .compact #device { display: none; }
  .compact .track { margin-top: 6px; }

  /* sites */
  .site { display: inline-block; margin: 4px 18px 4px 0; font-size: 15px; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 8px; vertical-align: 1px; }
  .dot.down { background: var(--red); }

  /* phone */
  #pbat { font-size: 40px; font-weight: 300; line-height: 1; letter-spacing: -0.02em; margin-right: 12px; }
  .batt { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; margin-bottom: 5px; }
  .batt i { display: block; height: 100%; border-radius: 4px; background: var(--green); }

  /* focus timer */
  #ftime { font-size: 34px; font-weight: 300; letter-spacing: -0.02em; margin-right: 14px; }
  .flat { margin-bottom: 0; }
  #card-focus.focus { border-color: rgba(255, 69, 58, .75); }
  #card-focus.break { border-color: rgba(48, 209, 88, .75); }

  /* moods */
  #moods, #sites { overflow-x: auto; overflow-y: hidden; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  #moods::-webkit-scrollbar, #sites::-webkit-scrollbar { display: none; }
  .mood { display: inline-block; padding: 9px 16px; border-radius: 12px; margin-right: 8px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    -webkit-transition: -webkit-transform .1s ease-out, opacity .1s ease-out; transition: transform .1s ease-out, opacity .1s ease-out; }
  .mood.on { box-shadow: inset 0 0 0 2.5px #fff; }

  /* stats */
  .fill { height: 100%; background: var(--blue); border-radius: 3px; }
  .chart { height: 180px; -webkit-align-items: flex-end; align-items: flex-end; margin-top: 16px; }
  .chart .colx { -webkit-flex: 1; flex: 1; margin: 0 4px; height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: flex-end; justify-content: flex-end; text-align: center; }
  .chart .colx i { display: block; background: var(--blue); border-radius: 5px 5px 2px 2px; min-height: 2px; }
  .chart .colx span { font-size: 11px; margin-top: 5px; }

  /* photo frame (idle slideshow) */
  #frame { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 40; background: #000; }
  .ph { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: center / cover no-repeat; opacity: 0; -webkit-transition: opacity 1.5s; transition: opacity 1.5s; }
  .ph.show { opacity: 1; }
  #frameinfo { position: absolute; left: 36px; bottom: 28px; right: 36px; text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 4px rgba(0,0,0,.5); }
  #fclock { font-size: 100px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; }
  #fdate { font-size: 22px; font-weight: 500; margin-top: 6px; }
  #fsong { font-size: 15px; margin-top: 8px; color: rgba(255,255,255,.85); }

  /* layout editing */
  #gear, #statsbtn { position: fixed; right: 8px; bottom: 8px; width: 36px; height: 36px; border-radius: 50%; background: rgba(60,60,64,.6); z-index: 5;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #statsbtn { right: 52px; }
  #gear svg, #statsbtn svg { width: 18px; height: 18px; fill: var(--label2); }
  .edit { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 3; background: rgba(0,0,0,.62); border-radius: inherit;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
    -webkit-align-content: center; align-content: center; padding: 4px; box-sizing: border-box; }
  .editing .edit { display: -webkit-flex; display: flex; }
  .editing #grid { padding-bottom: 76px; }
  .editing .card { box-shadow: 0 0 0 2px var(--blue); border-radius: 22px; }
  .edit .name { font-size: 15px; font-weight: 600; margin: 0 10px 0 4px; white-space: nowrap; }
  .edit .pill { margin: 3px; min-width: 22px; text-align: center; padding: 8px 11px; font-size: 13px; background: rgba(120,120,128,.5); }
  #editbar { display: none; position: fixed; left: 50%; bottom: 12px; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 6; padding: 10px 14px 4px; white-space: nowrap; }
  .editing #editbar { display: block; }

  /* sheets: a centred form sheet over a dimming scrim, as on iPad */
  #sheet { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; background: rgba(0,0,0,.45); padding: 26px; box-sizing: border-box; }
  #sheet.open { display: block; -webkit-animation: scrimIn .25s ease-out; animation: scrimIn .25s ease-out; }
  .sheet-in { height: 100%; max-width: 780px; margin: 0 auto; padding: 18px 22px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    background: rgba(28,28,30,.9); border-radius: 26px; }
  #sheet.open .sheet-in { -webkit-animation: sheetIn .38s cubic-bezier(.2,.9,.25,1); animation: sheetIn .38s cubic-bezier(.2,.9,.25,1); }
  @-webkit-keyframes scrimIn { from { background: rgba(0,0,0,0); } }
  @keyframes scrimIn { from { background: rgba(0,0,0,0); } }
  @-webkit-keyframes sheetIn { from { opacity: 0; -webkit-transform: translateY(36px) scale(.97); } }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(36px) scale(.97); } }
  .sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-right: 16px; }
  #sheetx { width: 30px; height: 30px; font-size: 14px; font-weight: 600; color: var(--label2); text-align: center; line-height: 30px; border-radius: 50%; background: var(--fill2); margin-left: 12px; -webkit-flex: none; flex: none; }
  #tools { margin-top: 14px; }
  #tools input[type=search], #tools input[type=text] { -webkit-appearance: none; width: 100%; height: 36px; box-sizing: border-box; font: 400 17px -apple-system, "Helvetica Neue", sans-serif; padding: 0 12px; border-radius: 10px;
    border: 0; background: rgba(118,118,128,.24); color: #fff; outline: none; -webkit-user-select: text; user-select: text; }
  #tools input::-webkit-input-placeholder { color: var(--label2); }
  #sheetbody { margin-top: 12px; -webkit-flex: 1; flex: 1; min-height: 0; }
  .item { padding: 9px 6px; border-bottom: 1px solid var(--sep); border-radius: 8px; font-size: 17px; }
  .thumb { width: 44px; height: 44px; border-radius: 6px; background: var(--fill2) center / cover no-repeat; margin-right: 14px; -webkit-flex: none; flex: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 8px; }
  .grid2 .pill { margin: 0; text-align: center; padding: 14px 8px; border-radius: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 18px; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 20; padding: 10px 18px; font-size: 15px; font-weight: 600; opacity: 0;
    border-radius: 999px; background: rgba(44,44,46,.88); -webkit-transition: opacity .25s; transition: opacity .25s; pointer-events: none; }
  #keymsg { display: none; position: fixed; left: 50%; top: 50%; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%); width: 420px; text-align: center; padding: 18px; z-index: 30; }

  /* gentler equivalents for people who ask for them */
  @media (prefers-reduced-motion: reduce) {
    * { -webkit-animation: none !important; animation: none !important; -webkit-transition: none !important; transition: none !important; }
    .ph { -webkit-transition: opacity .4s !important; transition: opacity .4s !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass { background: #1c1c1e; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="grid">
  <div class="card bare" id="card-clock">
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>

  <div class="card glass" id="card-weather">
    <div class="row" id="wnow">
      <div id="wicon">·</div><div id="wtemp">--°</div>
      <div id="wdesc" class="grow"><span id="wtext">Loading weather…</span><br><span class="dim" id="wmore"></span></div>
    </div>
    <div class="row days" id="days"></div>
  </div>

  <div class="card glass" id="card-phone">
    <div class="label" style="margin-bottom:10px">Phone</div>
    <div id="phone"><div class="dim small">Loading…</div></div>
  </div>

  <div class="card glass col" id="card-lights">
    <div class="row"><div class="label grow">Lights</div><span class="pill" id="allon">All on</span><span class="pill" id="alloff">All off</span></div>
    <div id="lights" class="scroll grow"><div class="dim" style="margin-top:10px">Loading…</div></div>
  </div>

  <div class="card glass col" id="card-music">
    <div class="row" style="margin-bottom:10px"><div class="label grow">Spotify</div><span class="pill" id="sync" style="margin:0 8px 0 0">Sync lights</span><span class="pill" id="browse" style="margin:0">Browse</span></div>
    <div class="row" style="-webkit-align-items:flex-start;align-items:flex-start">
      <div id="art"></div>
      <div class="grow"><div id="title" class="ellipsis">–</div><div id="artist" class="dim ellipsis"></div>
        <div id="device" class="dim small ellipsis" style="margin-top:6px"></div><div id="merr" class="err"></div></div>
    </div>
    <div class="track"><div id="bar"></div></div>
    <div class="row times mono dim"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="row vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="volume" min="0" max="100"></div>
    <div class="row controls">
      <div class="btn sm" id="shuffle"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 17.9 7.5l2 2V4h-5.4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2-3.2-3z"/></svg></div>
      <div class="btn" data-a="previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></div>
      <div class="btn big" id="pp" data-a="play"><svg viewBox="0 0 24 24"><path id="ppicon" d="M8 5v14l11-7z"/></svg></div>
      <div class="btn" data-a="next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div>
      <div class="btn sm" id="devbtn"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H4zM2 18h20v2H2z"/></svg></div>
    </div>
  </div>

  <div class="card glass row" id="card-focus">
    <div class="label" style="margin-right:16px">Focus</div>
    <div id="ftime" class="mono">25:00</div>
    <div id="fphase" class="dim small grow ellipsis">Ready</div>
    <span class="pill flat ellipsis" id="flight" style="max-width:150px">All lights</span>
    <span class="pill flat on" id="fgo">Start</span>
    <span class="pill flat" id="freset" style="margin-right:0">Reset</span>
  </div>

  <div class="card glass row" id="card-moods" style="padding-right:88px">
    <div class="label" style="margin-right:12px">Moods</div>
    <div class="seg" id="moodseg" style="margin-right:12px"></div>
    <div id="moods" class="grow"></div>
  </div>

  <div class="card glass row" id="card-sites">
    <div class="label" style="margin-right:18px">Sites</div>
    <div id="sites" class="grow"><span class="dim">Loading…</span></div>
  </div>
</div>

<div id="gear"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></div>
<div id="statsbtn"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10H4zm6 0V4h4v16h-4zm6 0v-7h4v7h-4z"/></svg></div>
<div id="editbar" class="glass"></div>

<div id="frame">
  <div class="ph" id="ph0"></div><div class="ph" id="ph1"></div>
  <div id="frameinfo"><div id="fclock"></div><div id="fdate"></div><div id="fsong" class="ellipsis"></div></div>
</div>

<div id="sheet"><div class="sheet-in glass">
  <div class="row"><div class="sheet-title" id="sheettitle"></div><div class="grow"><div class="seg" id="tabs"></div></div><div id="sheetx">✕</div></div>
  <div id="tools"></div>
  <div id="sheetbody" class="scroll"></div>
</div></div>

<div id="toast" class="glass"></div>
<div class="glass" id="keymsg">Add your dashboard key to the address:<br><span class="mono">…vercel.app/?key=YOUR_DASH_KEY</span><br><br><a href="?demo" class="pill on" style="text-decoration:none">Try the demo instead</a></div>
<div id="demotag" class="dim" style="display:none;position:fixed;left:50%;bottom:3px;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:4;font-size:11px;font-weight:600">Demo · sample data</div>

<script>
// ===== Settings: change the city to yours =====
var CITY = 'Varna';

(function () {
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function closest(el, cls, stop) { while (el && el !== stop) { if (el.classList && el.classList.contains(cls)) return el; el = el.parentNode; } return null; }
  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(function () { t.style.opacity = 0; }, 2600); }

  // Key comes from ?key=… once, then is remembered. The URL keeps it too, so "Add to Home Screen" works.
  var m = /[?&]key=([^&]+)/.exec(location.search);
  var KEY = m ? decodeURIComponent(m[1]) : (localStorage.getItem('dashKey') || '');
  if (m) localStorage.setItem('dashKey', KEY);
  // ?demo runs everything on sample data in the page, so anyone can try it without accounts.
  var DEMO = /[?&]demo(&|=|$)/.test(location.search);
  if (DEMO) { KEY = 'demo'; $('demotag').style.display = ''; }
  if (!KEY) $('keymsg').style.display = 'block';

  function art(a, b) {
    return 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><defs><linearGradient id="g" x2="1" y2="1"><stop offset="0" stop-color="' + a +
      '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs><rect width="10" height="10" fill="url(#g)"/></svg>');
  }
  var D = {
    lights: [{ sku: 'H6056', device: 'D1', name: 'Desk light bars', online: true, on: true, brightness: 80 },
      { sku: 'H6046', device: 'D2', name: 'Bed bar', online: true, on: false, brightness: 40 }],
    scenes: ['Sunrise', 'Sunset', 'Aurora', 'Forest', 'Ocean', 'Fire', 'Candlelight', 'Party', 'Romantic', 'Rainbow', 'Starry sky', 'Movie', 'Reading', 'Breathe', 'Lightning']
      .map(function (n, i) { return { name: n, kind: 'scene', value: { id: i, paramId: i } }; }).concat([{ name: 'My chill', kind: 'diyScene', value: 7 }]),
    tracks: [['Midnight Drive', 'Sample Artist', '#f2b04a', '#7a2d6b'], ['Neon Harbour', 'The Placeholders', '#0a84ff', '#34c759'], ['Paper Planes', 'Demo Kid', '#ff2d92', '#ff9500']],
    t: 0, playing: true, progress: 60000, at: Date.now(), shuffle: false, volume: 55, device: 'Living room speaker',
    playlists: [{ name: 'Liked Songs', sub: 'Your saved tracks', img: null, uri: 'liked' }, { name: 'Gym', sub: 'Playlist · me', img: art('#ff3b30', '#ff9500'), uri: 'spotify:playlist:gym' },
      { name: 'Chill evening', sub: 'Playlist · me', img: art('#0a84ff', '#bf5af2'), uri: 'spotify:playlist:chill' }, { name: 'Focus', sub: 'Playlist · me', img: art('#34c759', '#0a84ff'), uri: 'spotify:playlist:focus' }],
    devices: [{ id: 'd1', name: 'Living room speaker', sub: 'Speaker' }, { id: 'd2', name: 'Desktop PC', sub: 'Computer' }, { id: 'd3', name: 'Phone', sub: 'Smartphone' }],
    phone: { battery: { level: 82, charging: false, at: Date.now() - 12 * 60000 }, presence: { home: true, at: Date.now() - 2 * 3600000 } },
    photos: ['mountain', 'harbour', 'forest', 'city', 'desert', 'coast'].map(function (x) { return 'https://picsum.photos/seed/' + x + '/1600/1200'; }),
    stats: { songs: [['Midnight Drive — Sample Artist', 42], ['Neon Harbour — The Placeholders', 31], ['Paper Planes — Demo Kid', 24], ['Slow Tide — Sample Artist', 17], ['Glass Rooms — Demo Kid', 9]].map(function (x) { return { name: x[0], count: x[1] }; }),
      scenes: [['Aurora', 18], ['Sunset', 14], ['Movie', 11], ['Reading', 7], ['My chill', 5]].map(function (x) { return { name: x[0], count: x[1] }; }),
      days: [6, 9, 4, 12, 15, 8, 3, 10, 14, 7, 11, 18, 9, 13].map(function (c, i) { return { day: new Date(Date.now() - (13 - i) * 864e5).toISOString().slice(5, 10), songs: c }; }),
      focusWeek: 6, focusMinutes: 150, total: 178 }
  };
  function demoApi(method, path, b) {
    var q = path.split('?')[1] || '', tr = D.tracks[D.t];
    if (path.indexOf('/api/usage') === 0) return method === 'GET' ? D.stats : { ok: true };
    if (path.indexOf('/api/phone') === 0) return D.phone;
    if (path.indexOf('/api/photos') === 0) return D.photos;
    if (path.indexOf('/api/sites') === 0) return [{ url: 'https://example.com', up: true, status: 200, ms: 80 + Math.round(Math.random() * 60) }, { url: 'https://github.com', up: true, status: 200, ms: 120 + Math.round(Math.random() * 80) }, { url: 'https://old-project.example', up: false, status: 503 }];
    if (path.indexOf('/api/govee') === 0) {
      if (method === 'GET') return q.indexOf('scenes') >= 0 ? D.scenes : JSON.parse(JSON.stringify(D.lights));
      for (var i = 0; i < D.lights.length; i++) if (D.lights[i].device === b.device) {
        if (b.action === 'power') D.lights[i].on = !!b.value; else D.lights[i].on = true;
        if (b.action === 'brightness') D.lights[i].brightness = b.value;
      }
      return { ok: true };
    }
    if (method === 'GET') {
      if (q.indexOf('view=playlists') >= 0) return D.playlists;
      if (q.indexOf('view=devices') >= 0) return D.devices.map(function (d) { return { id: d.id, name: d.name, sub: d.sub + (d.name === D.device ? ' · playing here' : '') }; });
      if (q.indexOf('view=search') >= 0) {
        var term = decodeURIComponent((/q=([^&]*)/.exec(q) || ['', ''])[1]).toLowerCase();
        return D.tracks.map(function (t, i) { return { name: t[0], sub: 'Song · ' + t[1], img: art(t[2], t[3]), uri: 'spotify:track:' + i }; })
          .filter(function (r) { return (r.name + r.sub).toLowerCase().indexOf(term) >= 0; });
      }
      var p = D.progress + (D.playing ? Date.now() - D.at : 0);
      if (p > 200000) { D.t = (D.t + 1) % D.tracks.length; D.progress = 0; D.at = Date.now(); p = 0; tr = D.tracks[D.t]; }
      return { active: true, playing: D.playing, title: tr[0], artist: tr[1], art: art(tr[2], tr[3]), progress: p, duration: 200000, shuffle: D.shuffle, device: D.device, volume: D.volume };
    }
    D.progress += D.playing ? Date.now() - D.at : 0; D.at = Date.now();
    if (b.action === 'play' || b.action === 'pause') D.playing = b.action === 'play';
    if (b.action === 'next' || b.action === 'previous' || b.action === 'playUri') {
      var n = /^spotify:track:(\d)$/.exec(b.uri || '');
      D.t = n ? +n[1] : (D.t + (b.action === 'previous' ? D.tracks.length - 1 : 1)) % D.tracks.length;
      D.progress = 0; D.playing = true;
    }
    if (b.action === 'volume') D.volume = b.value;
    if (b.action === 'shuffle') D.shuffle = !!b.value;
    if (b.action === 'device') for (var k = 0; k < D.devices.length; k++) if (D.devices[k].id === b.id) D.device = D.devices[k].name;
    return { ok: true };
  }

  function api(method, path, body, cb) {
    if (DEMO) return setTimeout(function () { cb(null, demoApi(method, path, body)); }, 150);
    var x = new XMLHttpRequest();
    x.open(method, path, true);
    x.timeout = 15000;
    x.setRequestHeader('x-dash-key', KEY);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function () {
      var d = null; try { d = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300) cb(null, d);
      else cb((d && d.error) || ('Error ' + x.status), d);
    };
    x.onerror = function () { cb('No connection'); };
    x.ontimeout = function () { cb('Timed out'); };
    x.send(body ? JSON.stringify(body) : null);
  }
  function getJSON(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onload = function () { try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb('Bad response'); } };
    x.onerror = function () { cb('No connection'); };
    x.send();
  }

  // ---------- Text-character landscape background ----------
  function hash(x, y) { var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
  function noise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y) { var v = 0, amp = 0.5; for (var i = 0; i < 4; i++) { v += amp * noise(x, y); x *= 2; y *= 2; amp *= 0.5; } return v; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  var SKY_TOP = [10, 38, 70], SKY_LOW = [38, 108, 150], CLOUD = [244, 240, 232], CLOUD_SH = [150, 170, 190];
  var AMBER = [242, 176, 74], PINK = [243, 169, 189], ROCK = [70, 78, 92], GROUND = [40, 34, 38];
  function scene(x, y) {
    var ridge = 0.72 + 0.07 * fbm(x * 3 + 7, 1.3) - 0.05 * Math.sin(x * 3.1);
    if (y > ridge) {
      var n = fbm(x * 9, y * 9);
      if (n > 0.62) return mix(PINK, [255, 220, 230], (n - 0.62) * 2);
      if (n > 0.52) return mix(AMBER, [120, 70, 30], 1 - (n - 0.52) * 10);
      return mix(GROUND, ROCK, n * 1.4);
    }
    var col = mix(SKY_TOP, SKY_LOW, clamp(y / 0.75));
    var sx = x - 0.8, sy = (y - 0.22) * 1.3;
    col = mix(col, AMBER, clamp(Math.exp(-(sx * sx + sy * sy) * 30) * 0.9));
    var centre = 0.4 + 0.15 * (noise(x * 2.5, 9) - 0.5) * 2;
    var cl = (fbm(x * 3.2, y * 5 + 3) + 0.25) * Math.exp(-Math.pow((y - centre) / 0.22, 2));
    if (cl > 0.5) {
      var lit = clamp((cl - 0.5) * 3 + fbm(x * 14, y * 14) * 0.5 - 0.25 + (centre - y) * 1.5);
      col = mix(mix(col, CLOUD_SH, clamp((cl - 0.5) * 8)), CLOUD, lit);
    }
    return col;
  }
  var RAMP = ' .,:;-=+*x%#@';
  var wall = localStorage.getItem('wall') || 'mesh';
  function drawMesh() { // a few soft colour blobs on a tiny canvas; the browser's upscaling does the blurring for free
    var cv = $('bg'), W = 256, H = 192;
    cv.width = W; cv.height = H;
    var x = cv.getContext('2d');
    x.fillStyle = '#06060b'; x.fillRect(0, 0, W, H);
    var blobs = [[0.16, 0.22, 0.62, '74,44,214'], [0.86, 0.12, 0.55, '12,96,235'], [0.72, 0.92, 0.6, '204,44,124'], [0.08, 0.98, 0.5, '232,112,24'], [0.5, 0.5, 0.4, '44,24,96']];
    x.globalCompositeOperation = 'lighter';
    for (var i = 0; i < blobs.length; i++) {
      var q = blobs[i], g = x.createRadialGradient(q[0] * W, q[1] * H, 0, q[0] * W, q[1] * H, q[2] * W);
      g.addColorStop(0, 'rgba(' + q[3] + ',0.72)'); g.addColorStop(1, 'rgba(' + q[3] + ',0)');
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    }
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = 'rgba(0,0,0,0.16)'; x.fillRect(0, 0, W, H); // keeps white text readable over the brightest blob
  }
  function drawBg() {
    if (wall !== 'text') return drawMesh();
    var cv = $('bg'), dpr = window.devicePixelRatio || 1, w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.font = '8px Menlo, monospace';
    ctx.textBaseline = 'top';
    for (var gy = 0; gy < h; gy += 9) {
      for (var gx = 0; gx < w; gx += 6) {
        var c = scene(gx / w, gy / h), j = 0.85 + hash(gx, gy) * 0.3;
        var lum = (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 255;
        ctx.fillStyle = 'rgb(' + (c[0] * 0.35 | 0) + ',' + (c[1] * 0.35 | 0) + ',' + (c[2] * 0.35 | 0) + ')';
        ctx.fillRect(gx, gy, 6, 9);
        ctx.fillStyle = 'rgb(' + Math.min(255, c[0] * j | 0) + ',' + Math.min(255, c[1] * j | 0) + ',' + Math.min(255, c[2] * j | 0) + ')';
        ctx.fillText(RAMP.charAt(Math.min(RAMP.length - 1, (lum * j * RAMP.length) | 0)), gx, gy);
      }
    }
  }
  drawBg();
  function fillRange(el) {
    if (el.className) return; // the hue and temperature sliders show their own gradient
    var mn = +el.min || 0, mx = +el.max || 100;
    el.style.setProperty('--p', ((el.value - mn) / (mx - mn) * 100) + '%');
  }
  document.addEventListener('input', function (e) { if (e.target.type === 'range') fillRange(e.target); }, true);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { drawBg(); markCompact(); }, 300); });

  // ---------- Layout: card order, width (of 12 columns), height (rows) and visibility, saved on this device ----------
  var NAMES = { clock: 'Clock', weather: 'Weather', phone: 'Phone', lights: 'Lights', music: 'Spotify', focus: 'Focus', moods: 'Moods', sites: 'Sites' };
  var DEFAULT = [{ id: 'clock', w: 4, h: 2 }, { id: 'weather', w: 5, h: 2 }, { id: 'phone', w: 3, h: 2 }, { id: 'lights', w: 7, h: 4 }, { id: 'music', w: 5, h: 4 }, { id: 'focus', w: 7, h: 1 }, { id: 'sites', w: 5, h: 1 }, { id: 'moods', w: 12, h: 1 }];
  var layout;
  try { layout = JSON.parse(localStorage.getItem('layout')); } catch (e) {}
  if (!layout || layout.length !== DEFAULT.length) layout = JSON.parse(JSON.stringify(DEFAULT));

  var grid = $('grid');
  for (var li = 0; li < layout.length; li++) {
    var ed = document.createElement('div');
    ed.className = 'edit';
    ed.setAttribute('data-id', layout[li].id);
    ed.innerHTML = '<span class="name">' + NAMES[layout[li].id] + ' <span class="dim small"></span></span>' +
      '<span class="pill" data-e="left">◀</span><span class="pill" data-e="right">▶</span>' +
      '<span class="pill" data-e="w-">W−</span><span class="pill" data-e="w+">W+</span>' +
      '<span class="pill" data-e="h-">H−</span><span class="pill" data-e="h+">H+</span>' +
      '<span class="pill" data-e="hide">Hide</span>';
    $('card-' + layout[li].id).appendChild(ed);
  }

  function markCompact() {
    for (var i = 0; i < layout.length; i++) {
      // Hide a card's extras only when its full content really doesn't fit.
      var el = $('card-' + layout[i].id);
      el.classList.remove('compact');
      if (el.scrollHeight > el.clientHeight + 2) el.classList.add('compact');
    }
  }
  function applyLayout() {
    localStorage.setItem('layout', JSON.stringify(layout));
    for (var i = 0; i < layout.length; i++) {
      var L = layout[i], el = $('card-' + L.id);
      grid.appendChild(el); // re-appending in order sets the order
      el.style.display = L.hidden ? 'none' : '';
      el.style.gridColumn = 'span ' + L.w;
      el.style.gridRow = 'span ' + L.h;
      el.querySelector('.edit .dim').textContent = L.w + '×' + L.h;
    }
    var bar = '<span class="dim small" style="margin-right:8px">Hidden:</span>', any = false;
    for (var k = 0; k < layout.length; k++) if (layout[k].hidden) { any = true; bar += '<span class="pill" data-show="' + k + '">+ ' + NAMES[layout[k].id] + '</span>'; }
    if (!any) bar += '<span class="dim small" style="margin-right:12px">none</span>';
    $('editbar').innerHTML = bar + '<span class="pill" data-wall="1">Wallpaper</span><span class="pill" data-frame="1">Slideshow</span><span class="pill" data-reset="1">Reset</span><span class="pill on" data-done="1">Done</span>';
    setTimeout(markCompact, 0);
  }
  applyLayout();
  setInterval(markCompact, 4000); // cards fill in after their data loads

  $('gear').addEventListener('click', function () { document.body.classList.toggle('editing'); });
  grid.addEventListener('click', function (e) {
    var act = e.target.getAttribute && e.target.getAttribute('data-e');
    if (!act) return;
    var id = closest(e.target, 'edit', grid).getAttribute('data-id'), i = 0;
    while (layout[i].id !== id) i++;
    var L = layout[i];
    if (act === 'left' && i > 0) { layout.splice(i, 1); layout.splice(i - 1, 0, L); }
    if (act === 'right' && i < layout.length - 1) { layout.splice(i, 1); layout.splice(i + 1, 0, L); }
    if (act === 'w-') L.w = Math.max(2, L.w - 1);
    if (act === 'w+') L.w = Math.min(12, L.w + 1);
    if (act === 'h-') L.h = Math.max(1, L.h - 1);
    if (act === 'h+') L.h = Math.min(8, L.h + 1);
    if (act === 'hide') L.hidden = true;
    applyLayout();
  });
  $('editbar').addEventListener('click', function (e) {
    var t = e.target;
    if (t.getAttribute('data-show')) { layout[+t.getAttribute('data-show')].hidden = false; applyLayout(); }
    if (t.getAttribute('data-reset')) { layout = JSON.parse(JSON.stringify(DEFAULT)); applyLayout(); }
    if (t.getAttribute('data-done')) document.body.classList.remove('editing');
    if (t.getAttribute('data-wall')) { wall = wall === 'text' ? 'mesh' : 'text'; localStorage.setItem('wall', wall); drawBg(); }
    if (t.getAttribute('data-frame')) { document.body.classList.remove('editing'); if (!startFrame()) toast('No photos yet: set ICLOUD_ALBUM (see README)'); }
  });

  // ---------- Sheet: full-screen panel with tabs, a tools row and a scrolling list ----------
  var sheet = { tabs: [], tab: null, render: null, items: [], onItem: null };
  function openSheet(title, tabs, render) {
    sheet.tabs = tabs; sheet.render = render;
    $('sheettitle').textContent = title;
    $('sheet').className = 'open';
    showTab(tabs[0].id);
  }
  function showTab(id) {
    sheet.tab = id;
    var h = '';
    for (var i = 0; i < sheet.tabs.length; i++) h += '<span class="pill' + (sheet.tabs[i].id === id ? ' on' : '') + '" data-tab="' + sheet.tabs[i].id + '">' + sheet.tabs[i].label + '</span>';
    $('tabs').innerHTML = sheet.tabs.length > 1 ? h : '';
    $('tools').innerHTML = '';
    $('sheetbody').onclick = null;
    sheet.items = []; sheet.onItem = null;
    sheet.render(id);
  }
  function closeSheet() { $('sheet').className = ''; $('sheetbody').innerHTML = ''; if (document.activeElement) document.activeElement.blur(); }
  function listItems(items, onItem, empty) {
    sheet.items = items; sheet.onItem = onItem;
    var h = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<div class="item row" data-i="' + i + '">' + (it.img !== undefined ? '<div class="thumb" style="background-image:' + (it.img ? 'url(' + esc(it.img) + ')' : 'none') + '"></div>' : '') +
        '<div class="grow"><div class="ellipsis">' + esc(it.name) + '</div>' + (it.sub ? '<div class="dim small ellipsis">' + esc(it.sub) + '</div>' : '') + '</div></div>';
    }
    $('sheetbody').innerHTML = h || '<div class="dim" style="padding:12px 4px">' + (empty || 'Nothing here') + '</div>';
  }
  function loading() { $('sheetbody').innerHTML = '<div class="dim" style="padding:12px 4px">Loading…</div>'; }
  function sheetError(err) { $('sheetbody').innerHTML = '<div class="err" style="padding:8px 4px">' + esc(err) + '</div>'; }
  $('sheetx').addEventListener('click', closeSheet);
  $('tabs').addEventListener('click', function (e) { var t = e.target.getAttribute('data-tab'); if (t) showTab(t); });
  $('sheetbody').addEventListener('click', function (e) {
    var it = closest(e.target, 'item', $('sheetbody'));
    if (it && sheet.onItem) sheet.onItem(sheet.items[+it.getAttribute('data-i')]);
  });

  // ---------- Clock ----------
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function tick() {
    var d = new Date();
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    $('fclock').textContent = $('clock').textContent; $('fdate').textContent = $('date').textContent;
  }
  tick(); setInterval(tick, 1000);

  // ---------- Weather (Open-Meteo, free, no key, called straight from the iPad) ----------
  function wx(code) {
    if (code === 0) return ['☀️', 'Clear'];
    if (code <= 2) return ['⛅', 'Partly cloudy'];
    if (code === 3) return ['☁️', 'Overcast'];
    if (code <= 48) return ['🌫', 'Fog'];
    if (code <= 57) return ['🌦', 'Drizzle'];
    if (code <= 67 || (code >= 80 && code <= 82)) return ['🌧', 'Rain'];

    if (i !== null) applyMood(MOODS[+i]);
  });
  renderMoods();

  // ---------- Focus timer: lights go red while you focus, green on the break ----------
  var FOCUS_MIN = 25, BREAK_MIN = 5, F;
  try { F = JSON.parse(localStorage.getItem('focus')); } catch (e) {}
  if (!F || !F.phase) F = { phase: 'idle', target: 'all' };
  function fsave() { localStorage.setItem('focus', JSON.stringify(F)); }
  function ftargets() {
    var out = [];
    for (var i = 0; i < lights.length; i++) if (lights[i].online && (F.target === 'all' || F.target === lights[i].device)) out.push(lights[i]);
    return out;
  }
  function fphase(phase) {
    var t = ftargets(), i;
    if (phase === 'focus' && !F.saved) { F.saved = {}; for (i = 0; i < t.length; i++) F.saved[t[i].device] = t[i].on ? (t[i].color || -1) : 0; }
    F.phase = phase; F.left = null;
    F.endsAt = Date.now() + (phase === 'focus' ? FOCUS_MIN : BREAK_MIN) * 60000;
    for (i = 0; i < t.length; i++) control(t[i], 'color', phase === 'focus' ? 0xff2a1a : 0x34c759, phase === 'focus' ? 'Focus' : 'Break');
    fsave();
  }
  function fstop() { // put the lights back the way they were
    var t = ftargets(), saved = F.saved || {};
    if (F.phase !== 'idle') for (var i = 0; i < t.length; i++) {
      var was = saved[t[i].device];
      if (was === 0) { t[i].on = false; control(t[i], 'power', 0); }
      else if (was > 0) control(t[i], 'color', was);
      else control(t[i], 'colorTemp', 2700);
    }
    F = { phase: 'idle', target: F.target }; fsave();
  }
  function ftick() {
    var paused = F.phase !== 'idle' && F.left != null;
    var left = F.phase === 'idle' ? FOCUS_MIN * 60000 : paused ? F.left : F.endsAt - Date.now();
    if (F.phase !== 'idle' && !paused && left <= 0) {
      if (F.phase === 'focus') { api('POST', '/api/usage', { kind: 'focus', name: String(FOCUS_MIN) }, function () {}); toast('Focus done. Take a break'); fphase('break'); }
      else { toast('Break over'); fstop(); }
      return ftick();
    }
    var sec = Math.ceil(left / 1000);
    $('ftime').textContent = pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
    $('fphase').textContent = F.phase === 'idle' ? 'Ready · ' + FOCUS_MIN + '/' + BREAK_MIN + ' min' : (F.phase === 'focus' ? 'Focusing' : 'Break') + (paused ? ' · paused' : '');
    $('fgo').textContent = F.phase === 'idle' ? 'Start' : paused ? 'Resume' : 'Pause';
    $('card-focus').classList.remove('focus', 'break');
    if (F.phase !== 'idle') $('card-focus').classList.add(F.phase);
    var name = 'All lights';
    if (F.target === 'none') name = 'No lights';
    for (var i = 0; i < lights.length; i++) if (lights[i].device === F.target) name = lights[i].name;
    $('flight').textContent = name;
  }
  $('fgo').addEventListener('click', function () {
    if (F.phase === 'idle') fphase('focus');
    else if (F.left != null) { F.endsAt = Date.now() + F.left; F.left = null; fsave(); }
    else { F.left = F.endsAt - Date.now(); fsave(); }
    ftick();
  });
  $('freset').addEventListener('click', function () { fstop(); ftick(); });
  $('flight').addEventListener('click', function () {
    if (F.phase !== 'idle') return toast('Reset the timer to change its light');
    var opts = ['all'];
    for (var i = 0; i < lights.length; i++) opts.push(lights[i].device);
    opts.push('none');
    F.target = opts[(opts.indexOf(F.target) + 1) % opts.length]; fsave(); ftick();
  });
  ftick(); setInterval(ftick, 1000);

  // ---------- Usage stats ----------
  function openStats() {
    var data = null;
    openSheet('Usage · last 30 days', [{ id: 'songs', label: 'Top songs' }, { id: 'scenes', label: 'Top scenes' }, { id: 'days', label: 'Activity' }], function (tab) {
      if (!data) {
        loading();
        return api('GET', '/api/usage', null, function (err, d) {
          if (err) return sheetError(err);
          data = d; if ($('sheet').className === 'open') showTab(sheet.tab);
        });
      }
      var h = '', i, max;
      if (tab === 'days') {
        max = 1;
        for (i = 0; i < data.days.length; i++) max = Math.max(max, data.days[i].songs);
        for (i = 0; i < data.days.length; i++) h += '<div class="colx"><span class="dim">' + (data.days[i].songs || '') + '</span><i style="height:' + Math.round(data.days[i].songs / max * 80) + '%"></i><span class="dim mono">' + data.days[i].day.slice(3) + '</span></div>';
        $('sheetbody').innerHTML = '<div class="label">Songs played per day · last 14 days</div><div class="row chart">' + h + '</div>' +
          '<div style="margin-top:22px">Focus this week: <b>' + data.focusWeek + '</b> session' + (data.focusWeek === 1 ? '' : 's') + ' · <b>' + data.focusMinutes + '</b> min</div>' +
          '<div class="dim small" style="margin-top:6px">' + data.total + ' events logged in the last 30 days</div>';
        return;
      }
      var rows = data[tab];
      max = rows.length ? rows[0].count : 1;
      for (i = 0; i < rows.length; i++) h += '<div class="item"><div class="row"><div class="grow ellipsis">' + esc(rows[i].name) + '</div><span class="mono dim">' + rows[i].count + '</span></div>' +
        '<div class="track" style="margin-top:6px"><div class="fill" style="width:' + Math.round(rows[i].count / max * 100) + '%"></div></div></div>';
      $('sheetbody').innerHTML = h || '<div class="dim" style="padding:12px 4px">Nothing logged yet. ' + (tab === 'songs' ? 'Play some music' : 'Pick a scene from Themes') + ' and it shows up here.</div>';
    });
  }
  $('statsbtn').addEventListener('click', openStats);

  // ---------- Photo frame: after a few idle minutes, a slideshow with the clock on top ----------
  var IDLE_MIN = 5, photos = [], frameOn = false, frameI = 0, frameT, idleT;
  function loadPhotos() {
    if (!KEY) return;
    api('GET', '/api/photos', null, function (err, d) { if (!err && d && d.length) photos = d; });
  }
  function nextPhoto() {
    if (!frameOn || !photos.length) return;
    var url = photos[frameI % photos.length], img = new Image();
    img.onload = function () { // swap only once the next photo has loaded, so there is never a blank frame
      if (!frameOn) return;
      var show = $('ph' + (frameI % 2)), hide = $('ph' + ((frameI + 1) % 2));
      show.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
      show.className = 'ph show'; hide.className = 'ph';
      frameI++;
    };
    img.onerror = function () { frameI++; };
    img.src = url;
  }
  function startFrame() {
    if (frameOn) return true;
    if (!photos.length || $('sheet').className === 'open' || document.body.classList.contains('editing')) return false;
    frameOn = true; $('frame').style.display = 'block';
    nextPhoto(); frameT = setInterval(nextPhoto, 20000);
    return true;
  }
  function stopFrame() { frameOn = false; clearInterval(frameT); $('frame').style.display = 'none'; }
  function idle() { clearTimeout(idleT); idleT = setTimeout(startFrame, IDLE_MIN * 60000); }
  ['touchstart', 'mousedown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, idle, true); });
  $('frame').addEventListener('click', function () { stopFrame(); idle(); });
  loadPhotos(); setInterval(loadPhotos, 25 * 60000); idle();

  // ---------- Sites ----------
  function loadSites() {
    if (!KEY) return;
    api('GET', '/api/sites', null, function (err, d) {
      if (err) { $('sites').innerHTML = '<span class="err" style="margin:0">' + esc(err) + '</span>'; return; }
      var html = '';
      for (var i = 0; i < d.length; i++) {
        var name = d[i].url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        html += '<span class="site"><span class="dot' + (d[i].up ? '' : ' down') + '"></span>' + esc(name) +
          ' <span class="dim mono">' + (d[i].up ? d[i].ms + 'ms' : (d[i].status || 'down')) + '</span></span>';
      }
      $('sites').innerHTML = html || '<span class="dim">No sites set (SITES env var)</span>';
    });
  }
  loadSites(); setInterval(loadSites, 60000);
})();
</script>
</body>
</html>
